slug: "autowarehouse"
lang: "tr"
name: "AutoWarehouse — DWH Otomasyon"

websiteUrl: "https://autowarehouse.ai/"
pageTitle: "AutoWarehouse — Yapay Zekâ Destekli DWH Otomasyon | Intellica"
pageDescription: >
  AutoWarehouse: Model-odaklı veri ambarı otomasyonu; yapay zekâ destekli keşif,
  haritalama, ETL kod üretimi ve yönetişimli analitik — tamamen kendi altyapınızda.

hero:
  category: "Yapay Zekâ & Veri Platformu"
  titlePrefix: "AutoWarehouse — DWH"
  titleHighlight: "Otomasyon"
  description: >
    Kaynaktan içgörüye, otomatik olarak. Yapay zekâ destekli keşif, yönetişimli
    veri modelleme, deterministik ETL kod üretimi ve doğal dil analitiği — tümü
    kendi altyapınızda çalışır, hiçbir veri dışarı çıkmaz.

overview:
  problem: >
    Bir veri ambarı kurmak aylarca süren manuel keşif, modelleme ve ETL
    geliştirme gerektirir. Ekipler tablolara, kurumsal hafızaya ve
    her şema değişikliğinde bozulan kırılgan pipeline'lara boğulur.
  approach: >
    AutoWarehouse, manuel yaşam döngüsünü yapay zekâ ajan motoruyla değiştirir:
    kaynakları keşfeder, şemaları profiller, sütunları yönetişimli bir DataModel'e
    haritalandırır ve deterministik ETL kodu üretir — her adımda kullanıcı onayı ile.
  businessValue: >
    Aylar yerine haftalar içinde üretime hazır DWH. Kurala dayalı, öngörülebilir kod üretimi.
    Self-hosted, kapalı ağ dağıtımıyla tam veri egemenliği.
  whenPreferred:
    - "Birden fazla kaynak sistemden sıfırdan veri ambarı kurarken"
    - "Mevcut model yatırımlarını kaybetmeden DWH modernizasyonu hızlandırırken"
    - "Kapalı ağ, self-hosted dağıtım gerektiren düzenlenmiş sektörlerde"
    - "Manuel ETL geliştirme çok yavaş ve hataya açık olduğunda"
    - "Dağınık ERP, CRM ve operasyonel veritabanlarında analitiği birleştirirken"
  preferredNote: "Not: AutoWarehouse sektöre hazır DataModel şablonlarını (IFDM, ITDM, HRDM) ve tamamen özel modelleri destekler."

capabilities:
  label: "Yetenekler"
  heading: "Temel"
  headingHighlight: "Yetenekler"
  items:
    - title: "Yapay Zekâ Kaynak Keşfi"
      description: "Kaynak sistemlerin çok ajanlı analizi: şema profilleme, PII tespiti, varlık ilişkileri ve anomali işaretleri."
    - title: "Yönetişimli DataModel'ler"
      description: "Sektör şablonları (Finans, Telekom, İK) veya tamamen özel yıldız şema tasarımlarıyla model-odaklı mimari."
    - title: "Deterministik ETL Üretimi"
      description: "Airflow, dbt, Snowflake, Spark ve PL/SQL için kurala dayalı, öngörülebilir kod dışa aktarımı — eklenti tabanlı ve sürümlü."
    - title: "Database DNA Raporu"
      description: "Kapsamlı profilleme: satır sayıları, sütun dağılımları, anomali tespiti ve tablo sınıflandırması."
    - title: "Doğal Dil Analitiği"
      description: "Soruları düz Türkçe sorun, yönetişimli SQL ve görselleştirmeler alın — yerel LLM ile çalışır."
    - title: "Veri Kalite Motoru"
      description: "Null analizi, kardinalite kontrolleri, tamlık puanlaması ve veri üretime ulaşmadan kalite kapıları."

featureSection:
  heading: "Model-Odaklı"
  headingHighlight: "Mimari"
  description: >
    Keşif, haritalama, ETL, raporlama ve Talk-to-DWH hepsi tek bir yönetişimli
    DataModel üzerinden okur ve yazar. Bir yöneticinin aldığı yanıt ile bir
    mühendisin pipeline'ı kanıtlanabilir biçimde aynı şeydir.
  calloutTitle: "Tek Model, Her Katman"
  calloutDescription: "Kaynak keşfinden iş zekâsına kadar her bileşen tek bir yönetişimli gerçek üzerinde çalışır."
  image: "/assets/images/autowarehouse_feature.png"
  imageAlt: "AutoWarehouse Model-Odaklı Mimari"
  imageCaption: "AutoWarehouse: Tüm veri ambarı yaşam döngüsünü yöneten birleşik DataModel."

