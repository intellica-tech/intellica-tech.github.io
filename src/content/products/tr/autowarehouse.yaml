      title: "Keşfet"
      description: "Yapay zekâ ajanları kaynak sistemleri analiz eder — şemaları profiller, PII tespit eder, varlıkları ve ilişkileri haritalandırır."
    - number: "02"
      title: "Modelle"
      description: "Sektörel DataModel şablonu seçin veya yönetişimli boyutlar ve fact tabloları ile özel yıldız şema tasarlayın."
    - number: "03"
      title: "Eşle ve Üret"
      description: "Kullanıcı onayıyla yapay zekâ destekli sütun eşleme. Hedef platformunuz için deterministik ETL kod üretimi."
    - number: "04"
      title: "Dağıt ve Sorgula"
      description: "Ambarınızı yükleyin, raporlar oluşturun ve doğal dilde sorular sorun — hepsi tek bir DataModel tarafından yönetilir."

